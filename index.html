<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/terralearn-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraLearn — Precision Agriculture Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the journey's face (Saira), requested first so the WebGL headline can be drawn with it -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <!-- Boot screen: paints on the first frame, before any module arrives, in the hero's own
         green so the hand-off is seamless. The journey (hero/src/journey/Journey.tsx) fades it
         out once WebGL has drawn its first frame. Landing route only. -->
    <style>
      #boot-loader {
        position: fixed; inset: 0; z-index: 99; display: grid; place-items: center;
        background: radial-gradient(110% 90% at 55% 40%, #2b543c 0%, #0e2419 70%);
        color: #f3f5ef; font-family: "Saira", system-ui, sans-serif;
        transition: opacity 0.8s ease, visibility 0s linear 0.8s;
      }
      #boot-loader.is-done { opacity: 0; visibility: hidden; }
      #boot-loader .word { margin: 0; font-weight: 800; font-size: 13px; letter-spacing: 0.42em; text-transform: uppercase; opacity: 0.9; }
      #boot-loader .bar { position: relative; width: 120px; height: 1px; margin-top: 18px; overflow: hidden; background: rgba(243, 245, 239, 0.2); }
      #boot-loader .bar::after {
        content: ""; position: absolute; inset: 0; background: #f3f5ef; transform-origin: left;
        animation: boot-fill 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes boot-fill { from { transform: scaleX(0); } to { transform: scaleX(0.9); } }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <div><p class="word">TerraLearn</p><div class="bar"></div></div>
    </div>
    <script>
      if (location.pathname !== "/") document.getElementById("boot-loader").remove();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
